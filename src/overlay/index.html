<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Meeting Copilot</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="card" class="card hidden" data-status="hidden">
      <header class="row">
        <span class="drag-handle" title="Drag overlay" aria-hidden="true">⠿</span><span id="pill" class="pill">Ready</span>
        <div class="shortcuts" aria-label="Keyboard shortcuts">
          <span class="shortcut-item" title="Start / stop recording"><span>Record</span><kbd id="shortcut-record"></kbd></span>
          <span class="shortcut-item" title="Ask about your screen or audio"><span>Ask AI</span><kbd id="shortcut-answer"></kbd></span>
          <span class="shortcut-item" title="Screenshot"><span>Screenshot</span><kbd id="shortcut-screenshot"></kbd></span>
          <span class="shortcut-item" title="Full screenshot"><span>Full screenshot</span><kbd id="shortcut-fullScreenshot"></kbd></span>
          <span class="shortcut-item" title="Show / hide overlay"><span>Show/hide</span><kbd id="shortcut-toggle"></kbd></span>
          <span class="shortcut-item" id="stealth-control" title="Enter stealth mode"><span id="stealth-shortcut-label">Stealth</span><kbd id="shortcut-stealth"></kbd></span>
        </div>
      </header>
      <div id="text" class="text markdown"></div>
      <button id="overlay-improve-solution" type="button" hidden>Improve solution</button>
      <form id="overlay-ask" class="overlay-composer">
        <input id="overlay-question" aria-label="Your question" maxlength="4000" placeholder="Ask anything about your screen…" />
        <button id="overlay-stop-chat" type="button" hidden>Stop</button>
        <button id="overlay-send" type="submit" aria-label="Ask AI" title="Ask AI">↵</button>
      </form>
      <div id="overlay-toolbar" class="overlay-toolbar">
        <button id="overlay-settings" class="widget-brand" type="button" aria-label="Open Settings" title="Settings"><img src="../assets/app.png" alt="" width="28" height="28" /></button>
        <div class="widget-controls">
          <label class="screen-switch" title="Include your screen with questions"><input id="overlay-include-screen" type="checkbox" /> <span>▧ Screen</span></label>
          <button id="overlay-screen-share-protection" type="button" aria-pressed="false" title="Best-effort protection for screen sharing">◉ Protect</button>
          <label class="widget-mode"><span class="sr-only">Mode</span><select id="overlay-mode" aria-label="Mode"></select></label>
          <button id="overlay-audio" type="button">Listen</button>
        </div>
        <output id="overlay-clock" hidden></output>
        <button id="overlay-history" type="button">History</button>
        <details id="overlay-more" class="widget-more"><summary aria-label="More widget controls">•••</summary><div>
          <button id="overlay-dashboard" type="button">Open workspace</button>
          <button id="overlay-modes" type="button">Modes &amp; files</button>
          <button id="overlay-new-chat" type="button">New chat</button>
          <button id="overlay-end" type="button" hidden>End session</button>
          <button id="overlay-transcript-toggle" type="button" aria-pressed="false">Transcript</button>
          <button id="overlay-hide" type="button">Hide widget</button>
        </div></details>
      </div>
      <div id="overlay-transcript" class="text transcript" hidden></div>
    </div>
    <script src="markdown.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
