<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>Meeting Copilot</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="card" class="card hidden" data-status="hidden">
      <header class="row">
        <span id="pill" class="pill">Ready</span>
        <div class="shortcuts" aria-label="Keyboard shortcuts">
          <span class="shortcut-item" title="Start / stop recording"><span>Record</span><kbd id="shortcut-record"></kbd></span>
          <span class="shortcut-item" title="Answer latest question"><span>Answer</span><kbd id="shortcut-answer"></kbd></span>
          <span class="shortcut-item" title="Summarize"><span>Summary</span><kbd id="shortcut-summary"></kbd></span>
          <span class="shortcut-item" title="Meeting notes"><span>Notes</span><kbd id="shortcut-notes"></kbd></span>
          <span class="shortcut-item" title="Screenshot"><span>Screenshot</span><kbd id="shortcut-screenshot"></kbd></span>
          <span class="shortcut-item" title="Full screenshot"><span>Full screenshot</span><kbd id="shortcut-fullScreenshot"></kbd></span>
          <span class="shortcut-item" title="Show / hide overlay"><span>Show/hide</span><kbd id="shortcut-toggle"></kbd></span>
          <span class="shortcut-item" id="stealth-control" title="Restore application from stealth"><span>Restore</span><kbd id="shortcut-stealth"></kbd></span>
        </div>
      </header>
      <div id="text" class="text markdown"></div>
    </div>
    <script src="markdown.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
